<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="container mt-4">
    <h2 class="mb-3">Danh sách sản phẩm</h2>

    <div class="mb-3">
        <label for="categorySelect" class="form-label">Lọc theo danh mục</label>
        <select id="categorySelect" class="form-select"></select>
    </div>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th><th>Tiêu đề</th><th>Mô tả</th><th>Giá</th><th>Người bán</th>
        </tr>
        </thead>
        <tbody id="productTable"></tbody>
    </table>

<script>
const graphqlEndpoint = "/graphql";

// Hàm gọi GraphQL
function callGraphQL(query, variables, callback) {
    $.ajax({
        url: graphqlEndpoint,
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({query, variables}),
        success: res => callback(res.data)
    });
}

// Load categories vào select
function loadCategories() {
    const query = `query { tatCaCategory { id name } }`;
    callGraphQL(query, {}, data => {
        let html = '<option value="">-- Tất cả --</option>';
        data.tatCaCategory.forEach(c => {
            html += `<option value="${c.id}">${c.name}</option>`;
        });
        $("#categorySelect").html(html);
    });
}

// Load sản phẩm theo giá tăng dần hoặc theo category
function loadProducts(categoryId) {
    let query;
    let vars = {};
    if (categoryId) {
        query = `query($id: Long){ sanPhamTheoDanhMuc(danhMucId:$id){ id title desc price user { fullname } } }`;
        vars = {id: parseInt(categoryId)};
    } else {
        query = `query { sanPhamTheoGiaTangDan { id title desc price user { fullname } } }`;
    }

    callGraphQL(query, vars, data => {
        const products = data.sanPhamTheoDanhMuc || data.sanPhamTheoGiaTangDan;
        let html = "";
        products.forEach(p => {
            html += `<tr>
                <td>${p.id}</td>
                <td>${p.title}</td>
                <td>${p.desc||""}</td>
                <td>${p.price}</td>
                <td>${p.user ? p.user.fullname : ""}</td>
            </tr>`;
        });
        $("#productTable").html(html);
    });
}

$(document).ready(() => {
    loadCategories();
    loadProducts();

    $("#categorySelect").change(function() {
        const id = $(this).val();
        loadProducts(id);
    });
});
</script>
</body>
</html>
